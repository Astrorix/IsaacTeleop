[project]
name = "noitom-examples"
version = "0.0.0"  # Internal examples – not versioned
description = "Noitom G1 retargeting examples and tests"
requires-python = ">=3.10,<3.14"
dependencies = [
    "isaacteleop[retargeters-lite]",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
